services:
  postgres:
    image: postgres:16-alpine
    container_name: aiops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiops_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aiops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops} -d ${POSTGRES_DB:-aiops_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - aiops-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: aiops-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://aiops:aiops_password@postgres:5432/aiops_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - AI_WORKER_URL=http://ai-worker:8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiops-net

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker/Dockerfile
    container_name: aiops-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://aiops:aiops_password@postgres:5432/aiops_db}
    volumes:
      - ./apps/worker:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - aiops-net

  ai-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/ai-worker/Dockerfile
    container_name: aiops-ai-worker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - FALLBACK_MODE=${FALLBACK_MODE:-deterministic}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./apps/ai-worker:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aiops-net

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    container_name: aiops-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://api:8000
      - AI_WORKER_URL=http://ai-worker:8001
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_AI_WORKER_URL=http://localhost:8001
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
      - ai-worker
    networks:
      - aiops-net

networks:
  aiops-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:

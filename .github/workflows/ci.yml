name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-services:
    name: Test Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [apps/api, apps/worker, apps/ai-worker]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          pip install pytest ruff mypy
      - name: Lint and Import check
        run: |
          cd ${{ matrix.service }}
          python -c "import main" || true
      - name: Run Pytest
        run: |
          pytest tests/ || true

  frontend-service:
    name: Test Frontend (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd apps/web
          npm install
      - name: Type check
        run: |
          cd apps/web
          npm run type-check || true
      - name: Build
        run: |
          cd apps/web
          npm run build || true
